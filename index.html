<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>









<section CLASS="buttons">
    <input type="radio" value="streetup" name="tyletype">

    <input type="radio" value="streetdown" name="tyletype">

    <input type="radio" value="crossroad" name="tyletype">


    <input type="radio" value="turnleftdown" name="tyletype">

    <input type="radio" value="turnleftup" name="tyletype">

    <input type="radio" value="turnrightdown" name="tyletype">

    <input type="radio" value="turnrightdown" name="tyletype">

    <input type="radio" value="T-up" name="tyletype">

    <input type="radio" value="T-dow" name="tyletype">

    <input type="radio" value="T-left" name="tyletype">

    <input type="radio" value="T-right" name="tyletype">


</section>

<div class="playboard"></div>




<a href="Mainmenu.html">
    <button >zpět do menu</button>
</a>


<div id="popup-overlay" class="hidden"></div>

<div id="popup" class="hidden">
    <div class="popup-content">
        <form id="form-save">

            <label>Jméno uložení

                <input name="savename">

            </label>
            <button type="submit" id="savemap">Uložit mapu </button>
        </form>
        <button id="close-popup">Close</button>
    </div>
</div>



<div id="popup-overlay2" class="hidden"></div>

<div id="popup2" class="hidden">
    <div class="popup-content">
        <form id="form-jsonfile">

            <label>Vložte složku JSON:

                <input type="file" id="jsonFile" name="jsonfile" accept=".json">


            </label>
            <button type="submit" id="save2">Vložit uloženou mapu </button>
        </form>
        <button id="close-popup2">Close</button>
    </div>
</div>


<div id="popup-overlay3" class="hidden">
<div id="popup3" class="hidden">
    <div class="popup-content">
        <form id="form-directory">

            <label>Napište název ukládaného souboru:

                <input name="text" >

            </label>
            <button type="submit" id="save3">Uložit mapu </button>
        </form>
        <button id="close-popup3">Close</button>
    </div>
</div>
</div>


<button id="open-popup">Uložit mapu</button>

<button id="inport-json">Vložit uloženou mapu JSON</button>

<button id="export-json">Uložit mapu jako JSON</button>







<script src="script.js"></script>
</body>
</html>

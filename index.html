<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="globalstyle.css">
</head>
<body>









<section CLASS="buttons">
    <label>

        <input type="radio" value="streetup" name="tyletype">
        <img src="streetup.jpg" class="radioimages" alt="streetup">

    </label>




    <label>

        <input type="radio" value="crossroad" name="tyletype">
        <img src="crossroad.jpg" class="radioimages" alt="crossroad">

    </label>

    <label>

        <input type="radio" value="streetright" name="tyletype">
        <img src="streetright.jpg" class="radioimages" alt="streetright">

    </label>

    <label>

        <input type="radio" value="water" name="tyletype">
        <img src="water.jpg" class="radioimages" alt="water">

    </label>

    <label>

        <input type="radio" value="trava" name="tyletype">
        <img src="trava.jpg" class="radioimages" alt="trava">

    </label>

    <label>

        <input type="radio" value="turnleftdown" name="tyletype">
        <img src="turn-left_down.jpg" class="radioimages" alt="turn-left_down">

    </label>

    <label>

        <input type="radio" value="turnleftup" name="tyletype">
        <img src="turn-left_up.jpg" class="radioimages" alt="turn-left_up">

    </label>

    <label>

        <input type="radio" value="turnrightdown" name="tyletype">
        <img src="turn-right_down.jpg" class="radioimages" alt="turn-right_down">

    </label>

    <label>

        <input type="radio" value="turnrightdown" name="tyletype">
        <img src="turn-right_up.jpg" class="radioimages" alt="turn-right_up">

    </label>

    <label>

        <input type="radio" value="T-up" name="tyletype">
        <img src="T_no_up.png" class="radioimages" alt="T_no_up">

    </label>

    <label>

        <input type="radio" value="T-down" name="tyletype">
        <img src="T_no_down.png" class="radioimages" alt="T_no_down">

    </label>

    <label>

        <input type="radio" value="T-left" name="tyletype">
        <img src="T_no_left.png" class="radioimages" alt="T_no_left">

    </label>


    <label>

        <input type="radio" value="T-right" name="tyletype">
        <img src="T_no_right.png" class="radioimages" alt="T_no_right">

    </label>



</section>

<div class="playboard"></div>






<section>
<div class="hidden popup-overlay"></div>

<div class="popup hidden" id="popup1">
    <div class="popup-content">
        <form id="form-save">
            <label>Jméno uložení
                <input name="savename">

                <p class="hidden error">Název složky v localstorage nesmí být prázdný</p>
            </label>
            <button type="submit" id="savemap">Uložit mapu</button>
        </form>
        <button class="close-popup">Close</button>
    </div>
</div>
<div class="popup-overlay hidden" id="overlay1"></div>


<div class="popup hidden" id="popup2">
    <div class="popup-content">
        <form id="form-jsonfile">
            <label>Vložte složku JSON:
                <input type="file" id="jsonFile" name="jsonfile" accept=".json">

                <p class="hidden error">Složka musí být zadána</p>
            </label>
            <button type="submit" id="save2">Vložit uloženou mapu</button>
        </form>
        <button class="close-popup">Close</button>
    </div>
</div>
<div class="popup-overlay hidden" id="overlay2"></div>


<div class="popup hidden" id="popup3">
    <div class="popup-content">
        <form id="form-directory">
            <label>Napište název ukládaného souboru:
                <input name="text">
                <p class="hidden error">Název souboru nesmí být prázdný</p>
            </label>

            <button type="submit" id="save3">Uložit mapu</button>
        </form>
        <button class="close-popup">Close</button>
    </div>
</div>
<div class="popup-overlay hidden" id="overlay3"></div>
</section>


<section>

    <a href="Mainmenu.html">
        <button >zpět do menu</button>
    </a>

<button id="open-popup">Uložit mapu do localstorage</button>

<button id="inport-json">Vložit uloženou mapu JSON</button>

<button id="export-json">Uložit mapu jako JSON</button>

<button id="clear-button">Vyčistit mapu</button>



</section>



<script src="script.js"></script>
</body>
</html>
